<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Wallpaper — Menggambar Viral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-body: #eef2f7;
      --text-primary: #1a2233;
      --text-muted: #6b7a94;
      --border: #e4e9f2;
    }

    html, body {
      min-height: 100%;
      width: 100%;
    }

    body {
      background: var(--bg-body);
      background-image: radial-gradient(circle at 10% 10%, rgba(255, 180, 70, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(80, 140, 255, 0.08) 0%, transparent 40%);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* ============================================
       BANNER HEADER
       ============================================ */
    .banner {
      width: 100%;
      aspect-ratio: 32.5 / 4.7;
      flex-shrink: 0;
      background-image: url('https://i.ibb.co.com/v4CHctNW/header.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 15, 30, 0.1) 0%, rgba(10, 15, 30, 0.3) 100%);
      pointer-events: none;
    }

    /* ============================================
       KONTEN FORM
       ============================================ */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: clamp(18px, 3vh, 32px);
      padding: clamp(20px, 3.5vh, 40px) clamp(20px, 5vw, 60px) clamp(24px, 4vh, 48px);
    }

    .form-title {
      text-align: center;
      color: var(--text-primary);
      width: 100%;
      max-width: 640px;
    }

    .form-title h1 {
      font-size: clamp(1.4rem, 2.6vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6ec4 0%, #ff3d9a 50%, #ff8bcb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }

    .form-title p {
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      color: var(--text-muted);
    }

    /* Form Group & Field Input */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vh, 22px);
      width: 100%;
      max-width: 640px;
      align-items: stretch;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .field label {
      font-size: clamp(0.8rem, 1.1vw, 0.92rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .field label i {
      color: #ff3d9a;
      margin-right: 6px;
    }

    .field input {
      width: 100%;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: #f9fbfd;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.25s ease;
      outline: none;
    }

    .field input:focus {
      border-color: #ff3d9a;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 61, 154, 0.12);
    }

    .field input#nama {
      padding: clamp(14px, 1.8vh, 18px) clamp(18px, 2vw, 24px);
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      text-align: center;
    }

    .field input#nama::placeholder {
      text-align: center;
    }

    .field input#kode {
      padding: clamp(20px, 2.8vh, 30px) 20px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      text-align: center;
      letter-spacing: clamp(8px, 1.5vw, 16px);
      text-transform: uppercase;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 20px;
      max-width: 380px;
      margin: 0 auto;
    }

    .field input#kode:focus {
      border-color: #ff3d9a;
      box-shadow: 0 0 0 5px rgba(255, 61, 154, 0.15);
    }

    .field input#kode::placeholder {
      letter-spacing: 4px;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-weight: 500;
      color: #c5cddb;
      text-align: center;
    }

    /* Tombol Aksi */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.6vh, 18px);
      width: 100%;
      max-width: 640px;
      margin-top: 4px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: clamp(18px, 2.4vh, 24px) clamp(24px, 3vw, 40px);
      border-radius: 120px;
      font-weight: 700;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }

    .action-btn i {
      font-size: clamp(1.05rem, 1.7vw, 1.3rem);
    }

    .btn-download {
      background: linear-gradient(135deg, #ff6ec4 0%, #ff3d9a 50%, #ff8bcb 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -10px rgba(255, 61, 154, 0.7);
    }

    .btn-download:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 36px -12px rgba(255, 61, 154, 0.9);
    }

    .btn-download:active { transform: translateY(-2px); }

    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-back {
      background: #ffffff;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      box-shadow: 0 6px 16px -8px rgba(20, 30, 55, 0.15);
    }

    .btn-back:hover {
      background: #f5f8fc;
      transform: translateY(-4px);
      box-shadow: 0 14px 24px -10px rgba(20, 30, 55, 0.25);
    }

    /* Kotak Status Alert */
    .status-box {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 640px;
      padding: 16px 22px;
      border-radius: 16px;
      font-size: clamp(0.88rem, 1.2vw, 1rem);
      font-weight: 600;
      line-height: 1.4;
    }

    .status-box.show { display: flex; }
    .status-box i { font-size: 1.2rem; }

    .status-box.info {
      background: #e8f1ff;
      color: #1e4faa;
      border: 1.5px solid #c7dcff;
    }

    .status-box.success {
      background: #e6f9ee;
      color: #15703a;
      border: 1.5px solid #b8ecc9;
    }

    .status-box.error {
      background: #ffe8ec;
      color: #a31238;
      border: 1.5px solid #ffc4d0;
    }

    /* Spinner Animasi */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Slogan Footer */
    .slogan {
      text-align: center;
      padding: clamp(14px, 2vh, 22px) 16px;
      margin-top: auto;
      width: 100%;
      flex-shrink: 0;
    }

    .slogan-text {
      font-size: clamp(0.95rem, 1.8vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c00 50%, #ffc857 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .slogan-wrap {
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 18px);
    }

    .slogan-wrap::before,
    .slogan-wrap::after {
      content: "";
      height: 2px;
      width: clamp(24px, 5vw, 60px);
      background: linear-gradient(90deg, transparent, var(--border));
      border-radius: 2px;
    }

    .slogan-wrap::after {
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .banner { aspect-ratio: 20.8 / 4.7; }
      .content {
        gap: clamp(14px, 2.2vh, 22px);
        padding: clamp(16px, 2.5vh, 24px) 18px clamp(20px, 3vh, 28px);
      }
      .action-btn {
        padding: 16px 20px;
        font-size: 0.98rem;
        gap: 12px;
      }
      .field input#nama {
        padding: 13px 16px;
        font-size: 0.95rem;
      }
      .field input#kode {
        font-size: 1.9rem;
        letter-spacing: 10px;
        padding: 20px 14px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>

    <div class="content">
      <div class="form-title">
        <h1><i class="fas fa-image"></i> Download Wallpaper</h1>
        <p>Masukkan nama & kode untuk mengunduh wallpaper</p>
      </div>

      <div class="form-group">
        <div class="field">
          <label for="nama"><i class="fas fa-user"></i> Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama Anda" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="kode"><i class="fas fa-key"></i> Kode</label>
          <input
            type="text"
            id="kode"
            placeholder="XXXXXX"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="btnDownload" class="action-btn btn-download">
          <i class="fas fa-download"></i> Download
        </button>
        <a href="index.html" class="action-btn btn-back">
          <i class="fas fa-arrow-left"></i> Kembali
        </a>
      </div>

      <div class="status-box" id="statusBox">
        <i class="fas fa-info-circle" id="statusIcon"></i>
        <span id="statusText"></span>
      </div>

      <div class="slogan">
        <div class="slogan-wrap">
          <span class="slogan-text">Draw It. Make It Viral</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* URL Deployment Apps Script Web App */
    const API_URL = 'https://script.google.com/macros/s/AKfycbywl6IpyT0p_8DIIfinQTWiUc-yAQuv2dmGUkJO9e7TySbqDzyLfZaQSRdGwaVnDbxh/exec';

    const namaInput   = document.getElementById('nama');
    const kodeInput   = document.getElementById('kode');
    const btnDownload = document.getElementById('btnDownload');
    const statusBox   = document.getElementById('statusBox');
    const statusIcon  = document.getElementById('statusIcon');
    const statusText  = document.getElementById('statusText');

    /* Auto uppercase & sanitasi input kode */
    kodeInput.addEventListener('input', () => {
      kodeInput.value = kodeInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 6);
    });

    function showStatus(type, message) {
      statusBox.className = 'status-box show ' + type;
      if (type === 'info') statusIcon.className = 'fas fa-info-circle';
      else if (type === 'success') statusIcon.className = 'fas fa-check-circle';
      else if (type === 'error') statusIcon.className = 'fas fa-exclamation-circle';
      statusText.innerHTML = message;
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnDownload.disabled = true;
        btnDownload.innerHTML = '<span class="spinner"></span> Memproses...';
      } else {
        btnDownload.disabled = false;
        btnDownload.innerHTML = '<i class="fas fa-download"></i> Download';
      }
    }

    btnDownload.addEventListener('click', async () => {
      const nama = namaInput.value.trim();
      const kode = kodeInput.value.trim().toUpperCase();

      if (!nama) {
        showStatus('error', 'Nama wajib diisi!');
        namaInput.focus();
        return;
      }
      if (!kode || kode.length !== 6) {
        showStatus('error', 'Kode wajib diisi (6 karakter)!');
        kodeInput.focus();
        return;
      }

      setLoading(true);
      showStatus('info', 'Memeriksa kode...');

      try {
        const formData = new URLSearchParams();
        formData.append('nama', nama);
        formData.append('kode', kode);

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData.toString()
        });

        const result = await response.json();

        if (!result.success) {
          showStatus('error', result.message || 'Kode tidak ditemukan.');
          setLoading(false);
          return;
        }

        showStatus('success', `Berhasil! Mengunduh <b>${result.fileName}</b>...`);

        /* Trigger pengunduhan tanpa berpindah halaman */
        const a = document.createElement('a');
        a.href = result.downloadUrl;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
          document.body.removeChild(a);
        }, 1000);

      } catch (err) {
        console.error(err);
        showStatus('error', 'Terjadi kesalahan saat memproses permintaan.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
