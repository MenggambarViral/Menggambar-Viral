<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Wallpaper — Menggambar Viral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-body: #eef2f7;
      --text-primary: #1a2233;
      --text-muted: #6b7a94;
      --border: #e4e9f2;
    }

    html, body {
      min-height: 100%;
      width: 100%;
    }

    body {
      background: var(--bg-body);
      background-image: radial-gradient(circle at 10% 10%, rgba(255, 180, 70, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(80, 140, 255, 0.08) 0%, transparent 40%);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ============================================
       WRAPPER UTAMA
       ============================================ */
    .card {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* ============================================
       BANNER HEADER — ikut ter-scroll
       ============================================ */
    .banner {
      width: 100%;
      aspect-ratio: 32.5 / 4.7; /* DEFAULT: PC */
      flex-shrink: 0;
      background-image: url('https://i.ibb.co.com/v4CHctNW/header.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 15, 30, 0.1) 0%, rgba(10, 15, 30, 0.3) 100%);
      pointer-events: none;
    }

    /* ============================================
       KONTEN
       ============================================ */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: clamp(18px, 3vh, 32px);
      padding: clamp(20px, 3.5vh, 40px) clamp(20px, 5vw, 60px) clamp(24px, 4vh, 48px);
    }

    .form-title {
      text-align: center;
      color: var(--text-primary);
      width: 100%;
      max-width: 640px;
    }

    .form-title h1 {
      font-size: clamp(1.4rem, 2.6vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ff6ec4 0%, #ff3d9a 50%, #ff8bcb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }

    .form-title p {
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      color: var(--text-muted);
    }

    /* ---------- Form Group ---------- */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vh, 22px);
      width: 100%;
      max-width: 640px;
      align-items: stretch;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .field label {
      font-size: clamp(0.8rem, 1.1vw, 0.92rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .field label i {
      color: #ff3d9a;
      margin-right: 6px;
    }

    /* Input umum */
    .field input {
      width: 100%;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: #f9fbfd;
      color: var(--text-primary);
      font-family: inherit;
      transition: all 0.25s ease;
      outline: none;
    }

    .field input:focus {
      border-color: #ff3d9a;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 61, 154, 0.12);
    }

    /* ---------- Input Nama (CENTER) ---------- */
    .field input#nama {
      padding: clamp(14px, 1.8vh, 18px) clamp(18px, 2vw, 24px);
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      text-align: center;      /* ⬅️ Teks di tengah */
    }

    .field input#nama::placeholder {
      text-align: center;       /* ⬅️ Placeholder juga di tengah */
    }

    /* ---------- Input Kode (BESAR & CENTER) ---------- */
    .field input#kode {
      padding: clamp(20px, 2.8vh, 30px) 20px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      text-align: center;
      letter-spacing: clamp(8px, 1.5vw, 16px);
      text-transform: uppercase;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 20px;
      max-width: 380px;
      margin: 0 auto;
    }

    .field input#kode:focus {
      border-color: #ff3d9a;
      box-shadow: 0 0 0 5px rgba(255, 61, 154, 0.15);
    }

    .field input#kode::placeholder {
      letter-spacing: 4px;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-weight: 500;
      color: #c5cddb;
      text-align: center;
    }

    /* ---------- Tombol ---------- */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.6vh, 18px);
      width: 100%;
      max-width: 640px;
      margin-top: 4px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: clamp(18px, 2.4vh, 24px) clamp(24px, 3vw, 40px);
      border-radius: 120px;
      font-weight: 700;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }

    .action-btn i {
      font-size: clamp(1.05rem, 1.7vw, 1.3rem);
    }

    .btn-download {
      background: linear-gradient(135deg, #ff6ec4 0%, #ff3d9a 50%, #ff8bcb 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -10px rgba(255, 61, 154, 0.7);
    }
    .btn-download:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 36px -12px rgba(255, 61, 154, 0.9);
    }
    .btn-download:active { transform: translateY(-2px); }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-back {
      background: #ffffff;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      box-shadow: 0 6px 16px -8px rgba(20, 30, 55, 0.15);
    }
    .btn-back:hover {
      background: #f5f8fc;
      transform: translateY(-4px);
      box-shadow: 0 14px 24px -10px rgba(20, 30, 55, 0.25);
    }
    .btn-back:active { transform: translateY(-2px); }

    /* ---------- Status / Alert ---------- */
    .status-box {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 640px;
      padding: 16px 22px;
      border-radius: 16px;
      font-size: clamp(0.88rem, 1.2vw, 1rem);
      font-weight: 600;
      line-height: 1.4;
    }

    .status-box.show { display: flex; }
    .status-box i { font-size: 1.2rem; }

    .status-box.info {
      background: #e8f1ff;
      color: #1e4faa;
      border: 1.5px solid #c7dcff;
    }

    .status-box.success {
      background: #e6f9ee;
      color: #15703a;
      border: 1.5px solid #b8ecc9;
    }

    .status-box.error {
      background: #ffe8ec;
      color: #a31238;
      border: 1.5px solid #ffc4d0;
    }

    /* ---------- Spinner ---------- */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================
       SLOGAN
       ============================================ */
    .slogan {
      text-align: center;
      padding: clamp(14px, 2vh, 22px) 16px;
      margin-top: auto;
      width: 100%;
      flex-shrink: 0;
    }

    .slogan-text {
      font-size: clamp(0.95rem, 1.8vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c00 50%, #ffc857 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .slogan-wrap {
      display: inline-flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 18px);
    }

    .slogan-wrap::before,
    .slogan-wrap::after {
      content: "";
      height: 2px;
      width: clamp(24px, 5vw, 60px);
      background: linear-gradient(90deg, transparent, var(--border));
      border-radius: 2px;
    }

    .slogan-wrap::after {
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 900px) {
      .content {
        gap: clamp(16px, 2.5vh, 26px);
        padding: clamp(18px, 3vh, 30px) clamp(18px, 4vw, 40px) clamp(22px, 3.5vh, 36px);
      }
    }

    @media (max-width: 768px) {
      .banner { aspect-ratio: 20.8 / 4.7; }

      .content {
        gap: clamp(14px, 2.2vh, 22px);
        padding: clamp(16px, 2.5vh, 24px) 18px clamp(20px, 3vh, 28px);
      }

      .action-btn {
        padding: 16px 20px;
        font-size: 0.98rem;
        gap: 12px;
      }
      .action-btn i { font-size: 1.1rem; }

      .field input#nama {
        padding: 13px 16px;
        font-size: 0.95rem;
      }

      .field input#kode {
        font-size: 1.9rem;
        letter-spacing: 10px;
        padding: 20px 14px;
        max-width: 100%;
      }

      .slogan-text { letter-spacing: 1.5px; }
    }

    @media (max-width: 380px) {
      .action-btn {
        padding: 14px 18px;
        font-size: 0.92rem;
      }
      .field input#kode {
        font-size: 1.6rem;
        letter-spacing: 8px;
        padding: 18px 12px;
      }
      .slogan-text {
        font-size: 0.85rem;
        letter-spacing: 1px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .content { gap: 12px; padding: 12px 24px; }
      .action-btn { padding: 12px 18px; font-size: 0.9rem; }
      .field input#kode {
        font-size: 1.4rem;
        letter-spacing: 6px;
        padding: 12px 14px;
      }
      .slogan { padding: 8px 16px; }
      .slogan-text { font-size: 0.8rem; letter-spacing: 1px; }
      .slogan-wrap::before,
      .slogan-wrap::after { width: 20px; }
    }

    @media (min-width: 1400px) {
      .content { gap: 34px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>

    <div class="content">
      <div class="form-title">
        <h1><i class="fas fa-image"></i> Download Wallpaper</h1>
        <p>Masukkan nama & kode untuk mengunduh wallpaper</p>
      </div>

      <div class="form-group">
        <div class="field">
          <label for="nama"><i class="fas fa-user"></i> Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama Anda" autocomplete="off" required>
        </div>

        <div class="field">
          <label for="kode"><i class="fas fa-key"></i> Kode</label>
          <input
            type="text"
            id="kode"
            placeholder="XXXXXX"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
          >
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="btnDownload" class="action-btn btn-download">
          <i class="fas fa-download"></i> Download
        </button>
        <a href="index.html" class="action-btn btn-back">
          <i class="fas fa-arrow-left"></i> Kembali
        </a>
      </div>

      <div class="status-box" id="statusBox">
        <i class="fas fa-info-circle" id="statusIcon"></i>
        <span id="statusText"></span>
      </div>

      <div class="slogan">
        <div class="slogan-wrap">
          <span class="slogan-text">Draw It. Make It Viral</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       KONFIGURASI
       ============================================================ */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyoXXR6R60i1ztDFYC1aZQAOEKz0Y2QGZ2YzCoVLPHRLNAmiM2DB1eI3Esi_uVBDUrx/exec';
    const DEFAULT_EXT = 'jpg';

    /* ============================================================
       ELEMEN
       ============================================================ */
    const namaInput = document.getElementById('nama');
    const kodeInput = document.getElementById('kode');
    const btnDownload = document.getElementById('btnDownload');
    const statusBox = document.getElementById('statusBox');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');

    /* Auto uppercase & filter kode saat diketik */
    kodeInput.addEventListener('input', () => {
      kodeInput.value = kodeInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 6);
    });

    /* ============================================================
       UTIL STATUS
       ============================================================ */
    function showStatus(type, message) {
      statusBox.className = 'status-box show ' + type;
      if (type === 'info') statusIcon.className = 'fas fa-info-circle';
      else if (type === 'success') statusIcon.className = 'fas fa-check-circle';
      else if (type === 'error') statusIcon.className = 'fas fa-exclamation-circle';
      statusText.innerHTML = message;
    }

    function setLoading(isLoading) {
      if (isLoading) {
        btnDownload.disabled = true;
        btnDownload.innerHTML = '<span class="spinner"></span> Memproses...';
      } else {
        btnDownload.disabled = false;
        btnDownload.innerHTML = '<i class="fas fa-download"></i> Download';
      }
    }

    /* ============================================================
       AMBIL NAMA FILE DARI HEADER Content-Disposition
       ============================================================ */
    function getFileNameFromHeader(response, fallbackName) {
      const disposition =
        response.headers.get('Content-Disposition') ||
        response.headers.get('content-disposition');

      if (!disposition) return fallbackName;

      let match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
      if (match && match[1]) {
        try {
          return decodeURIComponent(match[1]).trim().replace(/^["']|["']$/g, '');
        } catch (e) { /* lanjut */ }
      }

      match = disposition.match(/filename="?([^";]+)"?/i);
      if (match && match[1]) {
        return match[1].trim().replace(/^["']|["']$/g, '');
      }

      return fallbackName;
    }

    /* ============================================================
       HANDLER DOWNLOAD
       ============================================================ */
    btnDownload.addEventListener('click', async () => {
      const nama = namaInput.value.trim();
      const kode = kodeInput.value.trim().toUpperCase();

      if (!nama) {
        showStatus('error', 'Nama wajib diisi!');
        namaInput.focus();
        return;
      }
      if (!kode) {
        showStatus('error', 'Kode wajib diisi!');
        kodeInput.focus();
        return;
      }
      if (kode.length !== 6) {
        showStatus('error', 'Kode harus 6 karakter!');
        kodeInput.focus();
        return;
      }

      setLoading(true);
      showStatus('info', 'Sedang memproses permintaan Anda...');

      try {
        const formData = new FormData();
        formData.append('nama', nama);
        formData.append('kode', kode);

        const response = await fetch(API_URL, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (!result.success) {
          showStatus('error', result.message || 'Kode tidak ditemukan atau tidak valid.');
          setLoading(false);
          return;
        }

        const sheetName = (result.fileName || 'wallpaper').trim();
        const fallbackName = /\.[a-zA-Z0-9]+$/.test(sheetName)
          ? sheetName
          : sheetName + '.' + DEFAULT_EXT;

        showStatus('info', 'Menyiapkan file untuk diunduh...');

        let downloadSuccess = false;

        try {
          const fileResponse = await fetch(result.downloadUrl);
          if (!fileResponse.ok) throw new Error('Gagal mengambil file');

          const blob = await fileResponse.blob();

          let finalName = getFileNameFromHeader(fileResponse, null);

          if (!finalName) {
            finalName = fallbackName;
            const ct = (fileResponse.headers.get('Content-Type') || '').toLowerCase();
            if (ct.includes('image/png')) finalName = sheetName + '.png';
            else if (ct.includes('image/webp')) finalName = sheetName + '.webp';
            else if (ct.includes('image/jpeg')) finalName = sheetName + '.jpg';
          }

          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);

          downloadSuccess = true;
          showStatus('success', `Berhasil! Wallpaper <b>${finalName}</b> sedang diunduh.`);
        } catch (err) {
          console.warn('Fetch blob gagal, fallback ke direct link:', err);
        }

        if (!downloadSuccess) {
          window.open(result.downloadUrl, '_blank');
          showStatus('success', `Wallpaper <b>${fallbackName}</b> dibuka di tab baru.`);
        }

      } catch (err) {
        console.error(err);
        showStatus('error', 'Terjadi kesalahan: ' + err.message);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
