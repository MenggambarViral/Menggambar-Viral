<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menggambar Viral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-body: #eef2f7;
      --text-primary: #1a2233;
      --text-muted: #6b7a94;
      --border: #e4e9f2;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg-body);
      background-image: radial-gradient(circle at 10% 10%, rgba(255, 180, 70, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(80, 140, 255, 0.08) 0%, transparent 40%);
    }

    .card {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============================================
       BANNER HEADER — GANTI GAMBAR DI SINI
       Ubah url() pada background-image

       PC  (>768px) : skala 32,5 : 4,7
       HP  (≤768px) : skala 20,8 : 4,7
       ============================================ */
    .banner {
      width: 100%;
      aspect-ratio: 32.5 / 4.7; /* DEFAULT: PC */
      flex-shrink: 0;
      background-image: url('https://i.ibb.co.com/99zby8Fb/header.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 15, 30, 0.1) 0%, rgba(10, 15, 30, 0.3) 100%);
      pointer-events: none;
    }

    /* ============================================
       KONTEN
       ============================================ */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: clamp(18px, 3vh, 32px);
      padding: clamp(20px, 3.5vh, 40px) clamp(20px, 5vw, 60px) clamp(24px, 4vh, 48px);
      overflow-y: auto;
    }

    /* ---------- Action Buttons (Pesan & Kerjasama) ---------- */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vh, 22px);
      width: 100%;
      max-width: 640px;
      align-items: stretch;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: clamp(20px, 2.6vh, 28px) clamp(24px, 3vw, 40px);
      border-radius: 120px;
      font-weight: 700;
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .action-btn i {
      font-size: clamp(1.15rem, 1.9vw, 1.5rem);
    }

    .btn-pesan {
      background: linear-gradient(135deg, #ffc857 0%, #ff8c00 100%);
      color: #1a2233;
      box-shadow: 0 12px 28px -10px rgba(255, 140, 0, 0.7);
    }
    .btn-pesan:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 36px -12px rgba(255, 140, 0, 0.85);
    }
    .btn-pesan:active { transform: translateY(-2px); }

    .btn-kerjasama {
      background: linear-gradient(135deg, #2b3a55 0%, #0f1726 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -10px rgba(15, 23, 38, 0.7);
    }
    .btn-kerjasama:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 36px -12px rgba(15, 23, 38, 0.85);
    }
    .btn-kerjasama:active { transform: translateY(-2px); }

    /* ---------- Divider ---------- */
    .divider {
      width: 100%;
      max-width: 900px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
    }

    /* ---------- Media Sosial ---------- */
    .social-section {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vh, 22px);
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .social-label {
      font-size: clamp(0.7rem, 1.4vw, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.5vw, 18px);
      width: 100%;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: clamp(12px, 1.4vw, 18px) clamp(20px, 2.4vw, 32px);
      border-radius: 60px;
      background: #ffffff;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: clamp(0.85rem, 1.3vw, 1.05rem);
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 12px -4px rgba(20, 30, 55, 0.1);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .social-btn i {
      font-size: clamp(1.05rem, 1.6vw, 1.35rem);
      transition: color 0.25s ease;
    }

    .social-btn.tiktok:hover {
      background: #010101; color: #fff; border-color: #010101;
      transform: translateY(-4px);
      box-shadow: 0 14px 22px -8px rgba(1, 1, 1, 0.5);
    }
    .social-btn.youtube:hover {
      background: #ff0000; color: #fff; border-color: #ff0000;
      transform: translateY(-4px);
      box-shadow: 0 14px 22px -8px rgba(255, 0, 0, 0.5);
    }
    .social-btn.instagram:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff; border-color: transparent;
      transform: translateY(-4px);
      box-shadow: 0 14px 22px -8px rgba(220, 39, 67, 0.5);
    }
    .social-btn.facebook:hover {
      background: #1877f2; color: #fff; border-color: #1877f2;
      transform: translateY(-4px);
      box-shadow: 0 14px 22px -8px rgba(24, 119, 242, 0.5);
    }
    .social-btn.email:hover {
      background: #d44638; color: #fff; border-color: #d44638;
      transform: translateY(-4px);
      box-shadow: 0 14px 22px -8px rgba(212, 70, 56, 0.5);
    }

    .social-btn.tiktok i { color: #010101; }
    .social-btn.tiktok:hover i { color: #ffffff; }
    .social-btn.youtube i { color: #ff0000; }
    .social-btn.youtube:hover i { color: #ffffff; }
    .social-btn.instagram i { color: #c13584; }
    .social-btn.instagram:hover i { color: #ffffff; }
    .social-btn.facebook i { color: #1877f2; }
    .social-btn.facebook:hover i { color: #ffffff; }
    .social-btn.email i { color: #d44638; }
    .social-btn.email:hover i { color: #ffffff; }

    .note {
      text-align: center;
      font-size: clamp(0.7rem, 1vw, 0.82rem);
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .note i { margin-right: 5px; }

    /* ============================================
       TABLET (≤900px)
       ============================================ */
    @media (max-width: 900px) {
      .content {
        gap: clamp(16px, 2.5vh, 26px);
        padding: clamp(18px, 3vh, 30px) clamp(18px, 4vw, 40px) clamp(22px, 3.5vh, 36px);
      }
    }

    /* ============================================
       HP (≤768px) — HEADER OTOMATIS 20,8 : 4,7
       ============================================ */
    @media (max-width: 768px) {
      .banner {
        aspect-ratio: 20.8 / 4.7;
      }

      .content {
        gap: clamp(14px, 2.2vh, 22px);
        padding: clamp(16px, 2.5vh, 24px) 18px clamp(20px, 3vh, 28px);
      }

      .social-section {
        gap: 12px;
      }

      .social-label {
        font-size: 0.68rem;
        letter-spacing: 4px;
      }

      .social-buttons {
        gap: 10px;
      }

      .social-btn {
        flex: 1 1 calc(50% - 10px);
        min-width: 130px;
        padding: 13px 12px;
        font-size: 0.88rem;
        gap: 8px;
      }
      .social-btn i { font-size: 1.05rem; }

      .social-btn.email {
        flex: 1 1 100%;
      }

      .action-btn {
        padding: 17px 20px;
        font-size: 1rem;
        gap: 12px;
      }
      .action-btn i { font-size: 1.15rem; }

      .note { font-size: 0.7rem; }
    }

    /* HP kecil */
    @media (max-width: 380px) {
      .social-btn {
        padding: 12px 10px;
        font-size: 0.82rem;
      }
      .social-btn i { font-size: 1rem; }
      .social-buttons { gap: 8px; }
      .action-btn {
        padding: 15px 18px;
        font-size: 0.95rem;
      }
    }

    /* ============================================
       LANDSCAPE HP
       ============================================ */
    @media (max-height: 520px) and (orientation: landscape) {
      .content {
        gap: 12px;
        padding: 12px 24px;
      }
      .social-label { display: none; }
      .social-buttons { gap: 8px; }
      .social-btn {
        padding: 8px 14px;
        font-size: 0.8rem;
        flex: 0 1 auto;
        min-width: auto;
      }
      .social-btn i { font-size: 0.95rem; }
      .divider { display: none; }
      .action-group { gap: 10px; max-width: 100%; }
      .action-btn {
        padding: 12px 18px;
        font-size: 0.9rem;
      }
      .action-btn i { font-size: 1rem; }
      .note { display: none; }
    }

    @media (min-width: 1400px) {
      .content { gap: 34px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- ============================================
         BANNER HEADER — GANTI GAMBAR DI SINI
         Ubah URL di background-image pada .banner
         ============================================ -->
    <div class="banner"></div>

    <div class="content">
      <!-- Tombol Aksi (Pesan & Kerjasama) - DIPINDAH KE ATAS -->
      <div class="action-group">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfPesanGambarViral/viewform" target="_blank" rel="noopener noreferrer" class="action-btn btn-pesan">
          <i class="fas fa-paint-brush"></i> Pesan Gambar
        </a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfKerjasamaViral/viewform" target="_blank" rel="noopener noreferrer" class="action-btn btn-kerjasama">
          <i class="fas fa-handshake"></i> Kerjasama
        </a>
        <div class="note">
          <i class="fas fa-arrow-up"></i> Klik tombol untuk mengisi formulir
        </div>
      </div>

      <div class="divider"></div>

      <!-- Media Sosial - DIPINDAH KE BAWAH -->
      <div class="social-section">
        <div class="social-label">Ikuti & Hubungi</div>
        <div class="social-buttons">
          <a href="https://www.tiktok.com/@menggambarviral" target="_blank" rel="noopener noreferrer" class="social-btn tiktok">
            <i class="fab fa-tiktok"></i> TikTok
          </a>
          <a href="https://www.youtube.com/@menggambarviral" target="_blank" rel="noopener noreferrer" class="social-btn youtube">
            <i class="fab fa-youtube"></i> YouTube
          </a>
          <a href="https://www.instagram.com/menggambarviral" target="_blank" rel="noopener noreferrer" class="social-btn instagram">
            <i class="fab fa-instagram"></i> Instagram
          </a>
          <a href="https://www.facebook.com/menggambarviral" target="_blank" rel="noopener noreferrer" class="social-btn facebook">
            <i class="fab fa-facebook-f"></i> Facebook
          </a>
          <a href="mailto:hello@menggambarviral.com" class="social-btn email">
            <i class="fas fa-envelope"></i> Email
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
